[workspace]
resolver = "3"
members = [
    "crates/bitstream",
    "crates/protocol",
    "crates/daemon",
    "crates/oracles",
    "crates/cli",
    "crates/catalog",
    "crates/client",
    "crates/app",
    "crates/media",
    "crates/aac",
    "crates/isobmff",
    "crates/flac",
    "crates/opus",
    "crates/prores",
    "crates/h264",
    "crates/h264enc",
    "crates/hevc",
    "crates/audio-dsp",
    "crates/matroska",
    "crates/psd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
authors = ["Zach Shallbetter <zachshallbetter@icloud.com>"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
derivable_impls = "allow"

[workspace.dependencies]
mediacraft-bitstream = { path = "crates/bitstream" }
mediacraft-protocol = { path = "crates/protocol" }
mediacraft-daemon = { path = "crates/daemon" }
mediacraft-client = { path = "crates/client" }
mediacraft-oracles = { path = "crates/oracles" }
mediacraft-catalog = { path = "crates/catalog" }
craft-media = { path = "crates/media" }
craft-aac = { path = "crates/aac" }
craft-isobmff = { path = "crates/isobmff" }
craft-flac = { path = "crates/flac" }
craft-opus = { path = "crates/opus" }
craft-prores = { path = "crates/prores" }
craft-h264 = { path = "crates/h264" }
craft-h264enc = { path = "crates/h264enc" }
craft-hevc = { path = "crates/hevc" }
craft-audio-dsp = { path = "crates/audio-dsp" }
craft-matroska = { path = "crates/matroska" }
craft-psd = { path = "crates/psd" }

craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "666c358065261a2816b376fa3bb10538dbf53040" }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "666c358065261a2816b376fa3bb10538dbf53040" }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "666c358065261a2816b376fa3bb10538dbf53040" }
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "666c358065261a2816b376fa3bb10538dbf53040" }

egui = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }

thiserror = "2"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
proptest = "1"
rayon = "1"
