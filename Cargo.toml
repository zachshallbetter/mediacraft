[workspace]
resolver = "3"
members = [
    "crates/bitstream",
    "crates/protocol",
    "crates/daemon",
    "crates/oracles",
    "crates/cli",
    "crates/catalog",
    "crates/client",
    "crates/app",
    "crates/media",
    "crates/aac",
    "crates/isobmff",
    "crates/flac",
    "crates/opus",
    "crates/prores",
    "crates/h264",
    "crates/h264enc",
    "crates/hevc",
    "crates/audio-dsp",
    "crates/matroska",
    "crates/psd",
    "crates/pdf",
    "crates/archive",
    "crates/image",
    "crates/preview",
    # Vendored from storytold/photocraft; see docs/VENDORED.md.
    "crates/vp8enc",
    "crates/raw",
    # Vendored from storytold/lightcraft; see docs/VENDORED.md.
    "crates/develop",
    "crates/develop-geom",
    "crates/develop-color",
    # Vendored from storytold/filmcraft; see docs/VENDORED.md.
    "crates/av1",
    "crates/vp9",
    "crates/vp8",
    "crates/dnx",
    "crates/mpeg2v",
    "crates/mpegts",
    "crates/mxf",
    "crates/ac3",
    "crates/avi",
    "crates/time",
    "crates/captions",
    "crates/testkit",
    # Vendored from storytold/craft-libs; see docs/VENDORED.md.
    "crates/atomic",
    "crates/settings",
    "crates/quit",
    "crates/ui",
    "crates/cms",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
authors = ["Zach Shallbetter <zachshallbetter@icloud.com>"]
repository = "https://github.com/zachshallbetter/mediacraft"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
derivable_impls = "allow"

[workspace.dependencies]
mediacraft-bitstream = { path = "crates/bitstream" }
mediacraft-protocol = { path = "crates/protocol" }
mediacraft-daemon = { path = "crates/daemon" }
mediacraft-client = { path = "crates/client" }
mediacraft-oracles = { path = "crates/oracles" }
mediacraft-catalog = { path = "crates/catalog" }
mediacraft-types = { path = "crates/media" }
craft-aac = { path = "crates/aac" }
craft-isobmff = { path = "crates/isobmff" }
craft-flac = { path = "crates/flac" }
craft-opus = { path = "crates/opus" }
craft-prores = { path = "crates/prores" }
craft-h264 = { path = "crates/h264" }
craft-h264enc = { path = "crates/h264enc" }
craft-hevc = { path = "crates/hevc" }
craft-audio-dsp = { path = "crates/audio-dsp" }
craft-matroska = { path = "crates/matroska" }
craft-psd = { path = "crates/psd" }
craft-pdf = { path = "crates/pdf" }
craft-archive = { path = "crates/archive" }
craft-image = { path = "crates/image" }
mediacraft-preview = { path = "crates/preview" }
craft-vp8enc = { path = "crates/vp8enc" }
craft-raw = { path = "crates/raw" }

# Vendored from storytold/lightcraft (docs/VENDORED.md).
craft-develop = { path = "crates/develop" }
craft-develop-geom = { path = "crates/develop-geom" }
craft-develop-color = { path = "crates/develop-color" }

# Vendored from storytold/filmcraft (docs/VENDORED.md).
craft-av1 = { path = "crates/av1" }
craft-vp9 = { path = "crates/vp9" }
craft-vp8 = { path = "crates/vp8" }
craft-dnx = { path = "crates/dnx" }
craft-mpeg2v = { path = "crates/mpeg2v" }
craft-mpegts = { path = "crates/mpegts" }
craft-mxf = { path = "crates/mxf" }
craft-ac3 = { path = "crates/ac3" }
craft-avi = { path = "crates/avi" }
craft-time = { path = "crates/time" }
craft-captions = { path = "crates/captions" }
mediacraft-testkit = { path = "crates/testkit" }

# Vendored from storytold/craft-libs (docs/VENDORED.md): MediaCraft builds from this tree alone.
craft-ui = { path = "crates/ui" }
craft-quit = { path = "crates/quit" }
craft-settings = { path = "crates/settings" }
craft-atomic = { path = "crates/atomic" }
craft-cms = { path = "crates/cms" }

egui = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }

thiserror = "2"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
proptest = "1"
rayon = "1"
zune-core = "0.5"
zune-jpeg = "0.5"
image = { version = "0.25", default-features = false }
jpeg-decoder = { version = "0.3", default-features = false }
quick-xml = "0.41"
roxmltree = "0.21"
miniz_oxide = "0.9"
# SVG rendering for craft-image. Same resvg as vectorcraft; usvg is the version it needs.
usvg = { version = "0.45", default-features = false }
resvg = { version = "0.45", default-features = false, features = ["raster-images"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Codec hot loops: the spec-vector tests of the vendored FilmCraft decoders are minutes slower in
# an unoptimised debug build (FilmCraft builds them the same way).
[profile.dev.package.craft-av1]
opt-level = 3

[profile.dev.package.craft-vp9]
opt-level = 3

[profile.dev.package.craft-vp8]
opt-level = 3

[profile.dev.package.craft-dnx]
opt-level = 3

[profile.dev.package.craft-mpeg2v]
opt-level = 3

[profile.dev.package.craft-ac3]
opt-level = 3

# The VP8 encoder's timing test (crates/vp8enc) needs optimised code to see a quadratic slowdown.
[profile.dev.package.craft-vp8enc]
opt-level = 3
