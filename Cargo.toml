[workspace]
resolver = "3"
members = [
    "crates/bitstream",
    "crates/protocol",
    "crates/daemon",
    "crates/oracles",
    "crates/cli",
    "crates/catalog",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
authors = ["Zach Shallbetter <zachshallbetter@icloud.com>"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
mediacraft-bitstream = { path = "crates/bitstream" }
mediacraft-protocol = { path = "crates/protocol" }
mediacraft-daemon = { path = "crates/daemon" }
mediacraft-oracles = { path = "crates/oracles" }
mediacraft-catalog = { path = "crates/catalog" }

filmcraft-bitstream = { path = "../craft-compat/filmcraft/crates/bitstream" }
filmcraft-aac = { path = "../craft-compat/filmcraft/crates/aac" }
filmcraft-isobmff = { path = "../craft-compat/filmcraft/crates/isobmff" }
filmcraft-h264 = { path = "../craft-compat/filmcraft/crates/h264" }
filmcraft-h264enc = { path = "../craft-compat/filmcraft/crates/h264enc" }
filmcraft-audio-dsp = { path = "../craft-compat/filmcraft/crates/audio-dsp" }
filmcraft-flac = { path = "../craft-compat/filmcraft/crates/flac" }
filmcraft-prores = { path = "../craft-compat/filmcraft/crates/prores" }
filmcraft-opus = { path = "../craft-compat/filmcraft/crates/opus" }
filmcraft-hevc = { path = "../craft-compat/filmcraft/crates/hevc" }

craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "666c358065261a2816b376fa3bb10538dbf53040" }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "666c358065261a2816b376fa3bb10538dbf53040" }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "666c358065261a2816b376fa3bb10538dbf53040" }
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "666c358065261a2816b376fa3bb10538dbf53040" }

egui = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
proptest = "1"
