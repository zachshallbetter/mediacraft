# Licence policy for the MediaCraft workspace. See docs/LICENSING.md for the rules behind it.
# Check with: cargo deny check licenses

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    # Bundled font data only (egui's default fonts, craft-fonts).
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # Weak, file-level copyleft. Allowed as an unmodified dependency behind an optional cargo
    # feature; see docs/LICENSING.md.
    "MPL-2.0",
]

[licenses.private]
ignore = true
