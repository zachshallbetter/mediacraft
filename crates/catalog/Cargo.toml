[package]
name = "mediacraft-catalog"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Zach Shallbetter <zachshallbetter@icloud.com>"]
description = "Digital asset catalog, filesystem indexing, stream inspection, and derivative relationship tracking for MediaCraft"

[dependencies]
mediacraft-protocol = { workspace = true }
craft-pdf = { workspace = true }
craft-archive = { workspace = true }
craft-image = { workspace = true }
craft-isobmff = { workspace = true }
craft-matroska = { workspace = true }
craft-mpegts = { workspace = true }
craft-mxf = { workspace = true }
craft-mpeg2v = { workspace = true }
craft-h264 = { workspace = true }
craft-hevc = { workspace = true }
craft-atomic = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Synthetic MP4 fixtures for the probe tests.
mediacraft-bitstream = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
